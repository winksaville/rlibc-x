[package]
name = "func-analysis"
version = "0.1.0"
edition = "2021"
description = "Analyze libc function sizes and reference counts in ELF binaries"
license = "MIT OR Apache-2.0"

[dependencies]
goblin = "0.9"
capstone = "0.12"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
