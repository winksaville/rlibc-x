[build]

# Target is the default target created using:
# rustc +nightly -Z unstable-options \
# --print target-spec-json \
#  --target x86_64-unknown-linux-gnu \
#  > x86_64-unknown-linux-rlibc-x2.json
target = ".cargo/x86_64-unknown-linux-rlibc-x2.json"

# Eliminate need to pass -Z build-std on command line
[unstable]
build-std = ["core", "alloc", "std", "panic_abort"]
